<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="360" viewBox="0 0 1920 360" role="img" aria-label="新闻资讯主题底纹">
  <!-- 透明底，叠加在标准蓝色渐变横幅之上； motifs 集中在右侧，左侧留白给标题 -->
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 细网格（与首页 hero 同语言） -->
  <g stroke="#FFFFFF" opacity=".05">
    <line x1="0" y1="45" x2="1920" y2="45"/><line x1="0" y1="90" x2="1920" y2="90"/>
    <line x1="0" y1="135" x2="1920" y2="135"/><line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="225" x2="1920" y2="225"/><line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="315" x2="1920" y2="315"/>
  </g>

  <!-- 背景光晕与雷达环 -->
  <circle cx="1040" cy="70" r="70" fill="url(#glow)"/>
  <circle cx="1300" cy="320" r="85" fill="url(#glow)"/>
  <circle cx="1820" cy="150" r="130" fill="url(#glow)"/>
  <g fill="none" stroke="#FFFFFF" opacity=".08">
    <circle cx="1920" cy="180" r="70"/>
    <circle cx="1920" cy="180" r="130"/>
    <circle cx="1920" cy="180" r="190"/>
  </g>
  <circle cx="1900" cy="30" r="230" fill="#FFFFFF" opacity=".06"/>

  <!-- 资讯气泡组 -->
  <g stroke="#FFFFFF" fill="none" opacity=".85">
    <rect x="1180" y="70" width="76" height="46" rx="10" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".08"/>
    <path d="M1200 116 l-5 13 13 -10" stroke-width="2.5"/>
    <line x1="1192" y1="88" x2="1244" y2="88" stroke-width="2" opacity=".6"/>
    <line x1="1192" y1="99" x2="1232" y2="99" stroke-width="2" opacity=".6"/>
    <rect x="1258" y="128" width="60" height="40" rx="9" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".08"/>
    <path d="M1300 168 l4 13 -14 -10" stroke-width="2.5"/>
    <circle cx="1278" cy="148" r="2.5" fill="#FFFFFF" fill-opacity=".65" stroke="none"/>
    <circle cx="1290" cy="148" r="2.5" fill="#FFFFFF" fill-opacity=".65" stroke="none"/>
    <circle cx="1302" cy="148" r="2.5" fill="#FFFFFF" fill-opacity=".65" stroke="none"/>
    <rect x="1198" y="176" width="46" height="34" rx="8" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".08"/>
    <path d="M1214 210 l-4 11 12 -9" stroke-width="2.5"/>
    <line x1="1221" y1="185" x2="1221" y2="196" stroke-width="2.5" opacity=".7"/>
    <circle cx="1221" cy="202" r="1.8" fill="#FFFFFF" fill-opacity=".7" stroke="none"/>
  </g>

  <!-- 报纸（幽灵纸 + 主报纸） -->
  <g transform="translate(1360 84) rotate(3)" opacity=".35" stroke="#FFFFFF" fill="none">
    <rect x="0" y="0" width="184" height="136" rx="6" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".05"/>
    <line x1="14" y1="22" x2="76" y2="22" stroke-width="5" opacity=".7"/>
    <rect x="14" y="36" width="70" height="48" rx="3" stroke-width="2"/>
    <line x1="98" y1="40" x2="170" y2="40" stroke-width="2" opacity=".55"/>
    <line x1="98" y1="52" x2="170" y2="52" stroke-width="2" opacity=".55"/>
    <line x1="98" y1="64" x2="170" y2="64" stroke-width="2" opacity=".55"/>
  </g>
  <g transform="translate(1392 104) rotate(-4)" stroke="#FFFFFF" fill="none">
    <rect x="0" y="0" width="190" height="142" rx="6" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".09"/>
    <line x1="14" y1="21" x2="80" y2="21" stroke-width="6" opacity=".75"/>
    <rect x="148" y="13" width="28" height="11" rx="2" stroke-width="2" opacity=".7"/>
    <rect x="14" y="36" width="76" height="52" rx="3" stroke-width="2.2"/>
    <path d="M20 80 l18 -20 12 12 14 -16 16 24" stroke-width="2" opacity=".7"/>
    <circle cx="32" cy="46" r="4" fill="#F4C542" fill-opacity=".6" stroke="none"/>
    <g stroke-width="2" opacity=".55">
      <line x1="102" y1="42" x2="176" y2="42"/>
      <line x1="102" y1="54" x2="176" y2="54"/>
      <line x1="102" y1="66" x2="176" y2="66"/>
      <line x1="102" y1="78" x2="164" y2="78"/>
      <line x1="14" y1="100" x2="90" y2="100"/>
      <line x1="14" y1="112" x2="90" y2="112"/>
      <line x1="14" y1="124" x2="90" y2="124"/>
    </g>
    <line x1="102" y1="92" x2="176" y2="92" stroke="#F4C542" stroke-width="3" opacity=".6"/>
    <line x1="102" y1="106" x2="176" y2="106" stroke-width="2" opacity=".55"/>
    <line x1="102" y1="120" x2="176" y2="120" stroke-width="2" opacity=".55"/>
    <line x1="102" y1="132" x2="150" y2="132" stroke-width="2" opacity=".55"/>
  </g>

  <!-- 纸飞机 + 航迹 -->
  <path d="M1160 62 C1260 36 1380 34 1480 60" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 7" opacity=".4"/>
  <g transform="translate(1498 54) rotate(8)" stroke="#FFFFFF" fill="none">
    <path d="M0 16 L38 0 L20 30 L14 20 Z" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".22"/>
    <path d="M14 20 L38 0" stroke-width="1.5" opacity=".6"/>
  </g>

  <!-- 日历 -->
  <g transform="translate(1650 210) rotate(3)" stroke="#FFFFFF" fill="none">
    <rect x="0" y="16" width="104" height="82" rx="6" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".08"/>
    <line x1="0" y1="38" x2="104" y2="38" stroke-width="2" opacity=".5"/>
    <line x1="26" y1="8" x2="26" y2="24" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="78" y1="8" x2="78" y2="24" stroke-width="3.5" stroke-linecap="round"/>
    <g fill="#FFFFFF" fill-opacity=".45" stroke="none">
      <circle cx="18" cy="54" r="2"/><circle cx="42" cy="54" r="2"/><circle cx="66" cy="54" r="2"/><circle cx="90" cy="54" r="2"/>
      <circle cx="18" cy="74" r="2"/><circle cx="42" cy="74" r="2"/><circle cx="90" cy="74" r="2"/>
      <circle cx="18" cy="88" r="2"/><circle cx="90" cy="88" r="2"/>
    </g>
    <rect x="56" y="64" width="20" height="20" rx="4" stroke="#F4C542" stroke-width="2.5"/>
    <circle cx="66" cy="74" r="2.5" fill="#F4C542" fill-opacity=".8" stroke="none"/>
  </g>

  <!-- RSS 广播 -->
  <g transform="translate(1748 96)" stroke="#FFFFFF" fill="none" stroke-linecap="round">
    <circle cx="0" cy="28" r="5" fill="#FFFFFF" fill-opacity=".8" stroke="none"/>
    <path d="M0 10 A18 18 0 0 1 18 28" stroke-width="3" opacity=".7"/>
    <path d="M0 -6 A34 34 0 0 1 34 28" stroke-width="3" opacity=".5"/>
  </g>

  <!-- 铅笔 -->
  <g transform="translate(1556 262) rotate(-24)" stroke="#FFFFFF" fill="none">
    <rect x="0" y="0" width="56" height="12" rx="2" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".15"/>
    <path d="M56 0 L70 6 L56 12 Z" stroke-width="2.5"/>
    <line x1="66" y1="3.5" x2="70" y2="6" stroke-width="2"/>
    <line x1="9" y1="0" x2="9" y2="12" stroke-width="2" opacity=".6"/>
  </g>

  <!-- 医疗十字与散点 -->
  <g stroke="#FFFFFF" stroke-width="3" opacity=".15">
    <line x1="1085" y1="40" x2="1117" y2="40"/><line x1="1101" y1="24" x2="1101" y2="56"/>
    <line x1="1852" y1="330" x2="1884" y2="330"/><line x1="1868" y1="314" x2="1868" y2="346"/>
  </g>
  <g fill="#FFFFFF" opacity=".5">
    <circle cx="1055" cy="210" r="4"/>
    <circle cx="1215" cy="242" r="3"/>
    <circle cx="1585" cy="180" r="2.5"/>
    <circle cx="1720" cy="40" r="3"/>
  </g>
  <g fill="#F4C542" opacity=".35">
    <circle cx="1620" cy="180" r="4"/>
    <circle cx="1305" cy="150" r="3"/>
  </g>
</svg>
