    <circle cx="38" cy="110" r="7" stroke-width="2.5"/>
    <rect x="0" y="88" width="56" height="7" rx="3.5" stroke-width="3"/>
    <line x1="22" y1="84" x2="46" y2="84" stroke-width="2" opacity=".7"/>
    <path d="M76 122 C90 98 88 60 60 40" stroke-width="3.5"/>
    <rect x="42" y="4" width="16" height="40" rx="8" stroke-width="3" fill="#FFFFFF" fill-opacity=".2" transform="rotate(-18 50 24)"/>
    <path d="M52 48 q8 6 8 12" stroke-width="2.5" opacity=".8"/>
    <rect x="33" y="58" width="7" height="15" rx="3" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".35"/>
    <rect x="45" y="60" width="7" height="18" rx="3" stroke-width="2.5" fill="#FFFFFF" fill-opacity=".35"/>
