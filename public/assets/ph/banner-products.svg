<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="360" viewBox="0 0 1920 360" role="img" aria-label="微生物诊断主题底纹">
  <!-- 透明底，叠加在标准蓝色渐变横幅之上； motifs 集中在右侧，左侧留白给标题 -->
  <defs>
    <radialGradient id="dish" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/>
      <stop offset=".8" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 细网格（与首页 hero 同语言） -->
  <g stroke="#FFFFFF" opacity=".05">
    <line x1="0" y1="45" x2="1920" y2="45"/><line x1="0" y1="90" x2="1920" y2="90"/>
    <line x1="0" y1="135" x2="1920" y2="135"/><line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="225" x2="1920" y2="225"/><line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="315" x2="1920" y2="315"/>
  </g>

  <!-- 背景光晕与雷达环，营造纵深 -->
  <circle cx="1030" cy="60" r="70" fill="url(#glow)"/>
  <circle cx="1320" cy="320" r="85" fill="url(#glow)"/>
  <circle cx="1830" cy="150" r="130" fill="url(#glow)"/>
