  <g opacity=".85" fill="none" stroke="#FFFFFF" stroke-width="2.5">
    <rect x="1057" y="112" width="46" height="16" rx="8" transform="rotate(-18 1080 120)"/>
    <rect x="1237" y="60" width="46" height="16" rx="8" transform="rotate(14 1260 68)"/>
    <rect x="1274" y="150" width="46" height="16" rx="8" transform="rotate(-10 1297 158)"/>
    <rect x="1600" y="180" width="46" height="16" rx="8" transform="rotate(24 1623 188)"/>
    <rect x="1418" y="322" width="46" height="16" rx="8" transform="rotate(-8 1441 330)"/>
    <rect x="1810" y="300" width="46" height="16" rx="8" transform="rotate(-14 1833 308)"/>
