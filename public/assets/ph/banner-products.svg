    <circle cx="1430" cy="185" r="117.6" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".5"/>
    <circle cx="1430" cy="185" r="109.2" fill="#FFFFFF" opacity=".08"/>
    <line x1="1309" y1="115" x2="1551" y2="255" stroke="#FFFFFF" stroke-width="1.5" opacity=".18"/>
    <line x1="1551" y1="118" x2="1309" y2="252" stroke="#FFFFFF" stroke-width="1.5" opacity=".14"/>
    <g opacity=".9">
      <circle cx="1358" cy="140" r="12" fill="#F4C542" opacity=".8"/>
      <circle cx="1478" cy="238" r="9" fill="#FFFFFF" opacity=".55"/>
      <circle cx="1402" cy="228" r="5" fill="#D9534F" opacity=".6"/>
      <circle cx="1490" cy="128" r="12" fill="#FFFFFF" opacity=".4"/>
      <circle cx="1372" cy="240" r="6" fill="#FFFFFF" opacity=".5"/>
      <circle cx="1494" cy="196" r="8" fill="#F4C542" opacity=".55"/>
      <circle cx="1345" cy="185" r="4" fill="#FFFFFF" opacity=".45"/>
      <circle cx="1440" cy="180" r="5" fill="#FFFFFF" opacity=".5"/>
      <circle cx="1465" cy="155" r="9" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".6"/>
      <circle cx="1465" cy="155" r="3.5" fill="#FFFFFF" opacity=".6"/>
      <circle cx="1395" cy="168" r="2.2" fill="#FFFFFF" opacity=".6"/>
      <circle cx="1403" cy="160" r="2.2" fill="#FFFFFF" opacity=".55"/>
      <circle cx="1400" cy="175" r="2.2" fill="#F4C542" opacity=".6"/>
