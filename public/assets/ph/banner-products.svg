  <path d="M1200 138 q18 -20 36 0 t36 0 t36 0" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity=".6"/>
  <path d="M1540 60 q16 -16 32 0 t32 0" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".45"/>

  <!-- 分子/检测网络 -->
  <g opacity=".7">
    <line x1="1846" y1="120" x2="1880" y2="96" stroke="#FFFFFF" stroke-width="1.5" opacity=".5"/>
    <line x1="1880" y1="96" x2="1866" y2="60" stroke="#FFFFFF" stroke-width="1.5" opacity=".5"/>
    <line x1="1846" y1="120" x2="1812" y2="148" stroke="#FFFFFF" stroke-width="1.5" opacity=".5"/>
    <line x1="1880" y1="96" x2="1902" y2="138" stroke="#FFFFFF" stroke-width="1.5" opacity=".5"/>
    <circle cx="1846" cy="120" r="6" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="1880" cy="96" r="9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="1866" cy="60" r="4" fill="#FFFFFF" opacity=".55"/>
    <circle cx="1812" cy="148" r="5" fill="#F4C542" opacity=".5"/>
    <circle cx="1902" cy="138" r="4" fill="#FFFFFF" opacity=".5"/>
  </g>

  <!-- 医疗十字点缀 -->
  <g stroke="#FFFFFF" stroke-width="3" opacity=".15">
    <line x1="1092" y1="38" x2="1124" y2="38"/><line x1="1108" y1="22" x2="1108" y2="54"/>
    <line x1="1330" y1="62" x2="1362" y2="62"/><line x1="1346" y1="46" x2="1346" y2="78"/>
    <line x1="1856" y1="336" x2="1888" y2="336"/><line x1="1872" y1="320" x2="1872" y2="352"/>
  </g>

  <!-- 散点与光斑 -->
  <g fill="#FFFFFF" opacity=".5">
