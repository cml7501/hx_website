  <!-- 双球菌 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity=".7">
    <circle cx="1246" cy="205" r="6"/>
    <circle cx="1259" cy="205" r="6"/>
  </g>

  <!-- 链球菌链 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity=".8">
    <circle cx="1568" cy="300" r="10"/>
    <circle cx="1602" cy="318" r="8"/>
    <circle cx="1640" cy="300" r="12"/>
    <circle cx="1678" cy="322" r="7"/>
